version: '3.8'

services:
  # 1. PostgreSQL Database (Isolated inside loopin-network, no host port 5432)
  loopin-postgres:
    image: postgres:16-alpine
    container_name: loopin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-loopin_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-loopin_secret_password}
      POSTGRES_DB: ${DB_NAME:-loopin_v2}
    volumes:
      - loopin_postgres_data:/var/lib/postgresql/data
    networks:
      - loopin-network

  # 2. Redis Cache & Real-time (Isolated inside loopin-network, no host port 6379)
  loopin-redis:
    image: redis:7-alpine
    container_name: loopin-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - loopin_redis_data:/data
    networks:
      - loopin-network

  # 3. NestJS Backend API & WebSocket Gateway
  loopin-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: loopin-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://${DB_USER:-loopin_user}:${DB_PASSWORD:-loopin_secret_password}@loopin-postgres:5432/${DB_NAME:-loopin_v2}?schema=public"
      REDIS_URL: "redis://loopin-redis:6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN}
    depends_on:
      - loopin-postgres
      - loopin-redis
    ports:
      - "127.0.0.1:4005:4000" # Expose only to localhost for Host Nginx
    networks:
      - loopin-network

  # 4. Next.js Web App
  loopin-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: loopin-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: "https://loopin.codapi.site"
      NEXT_PUBLIC_API_URL: "https://loopin.codapi.site/api/v1"
      NEXT_PUBLIC_WS_URL: "wss://loopin.codapi.site"
    depends_on:
      - loopin-backend
    ports:
      - "127.0.0.1:3005:3000" # Expose only to localhost for Host Nginx
    networks:
      - loopin-network

  # 5. Next.js Admin Panel
  loopin-admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: loopin-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      - loopin-backend
    ports:
      - "127.0.0.1:3006:3001" # Expose only to localhost for Host Nginx
    networks:
      - loopin-network

networks:
  loopin-network:
    name: loopin-network
    driver: bridge

volumes:
  loopin_postgres_data:
    name: loopin_postgres_data
  loopin_redis_data:
    name: loopin_redis_data
