# Nginx Server Block Configuration for loopin.codapi.site
# Place this file in /etc/nginx/sites-available/loopin.codapi.site on the VPS host
# and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name loopin.codapi.site www.loopin.codapi.site;

    # Cloudflare / SSL Redirect (handled by Cloudflare or local certbot)
    # If using Let's Encrypt / Certbot on host:
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/loopin.codapi.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/loopin.codapi.site/privkey.pem;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. API Endpoints (Proxied to Loopin Backend Container Port 4005)
    location /api/ {
        proxy_pass http://127.0.0.1:4005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. WebSocket Gateway for Socket.IO (Proxied to Loopin Backend Container)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4005/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 3. Admin Panel (Proxied to Loopin Admin Container Port 3006)
    location /admin {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Next.js Web App (Proxied to Loopin Web Container Port 3005)
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
